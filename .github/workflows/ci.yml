name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-14
    steps:
      - name: Checkout
        # Pinned to commit SHA for supply-chain security: tags can be
        # moved by the repo owner (or a compromised maintainer), but a
        # SHA is immutable. Dependabot will propose PRs updating both
        # the SHA and the trailing version comment when new releases
        # happen. See .github/dependabot.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build -c debug

      - name: Test
        run: swift test
